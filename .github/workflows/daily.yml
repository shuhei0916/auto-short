name: daily

# 12:00 UTC = 21:00 JST. The video is scheduled for the next free slot
# (normally 15:00 UTC = 00:00 JST). GitHub may start cron runs late; the slot
# logic copes with that.
on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      count:
        description: "Number of videos"
        default: "2"

concurrency:
  group: daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Render and schedule
        env:
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
        run: python -m autoshort daily --count "${{ inputs.count || '2' }}"
      - name: Collect analytics
        if: always()
        continue-on-error: true
        env:
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
        run: python -m autoshort analytics
      - name: Commit history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history analytics
          git diff --cached --quiet || git commit -m "history: daily upload [skip ci]"
          git pull --rebase
          git push
